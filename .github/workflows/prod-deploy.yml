name: Gaming Web App - Production

on:
  pull_request:
    branches:
      - production
    types:
      - closed

# Later, in the jobs section of your actions.yml file.
jobs:
  if_merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      BASE-IMAGE: josleke/esgc
      RELEASE-TAG: 2026.07.15-Release
      GENERATE_SOURCEMAP: "false"
      VITE_APPLICATION_ID: ${{ vars.VITE_APPLICATION_ID || '0db1cf18-d986-44a9-ab8f-682a564cdfd2' }}
      VITE_BASE_URL: ${{ vars.VITE_BASE_URL || 'https://esgc.meld-tech.com' }}
      VITE_VALIDATE_URL: ${{ vars.VITE_VALIDATE_URL || 'https://esgcapp.enugustate.gov.ng/documents/licenses/' }}

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Node version 20 Setup
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Vite Production Build
        run: npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

#      - name: Set Release Tag Version
#        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}${RELEASE-TAG}" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.BASE-IMAGE }}
          tags: ${{ env.RELEASE-TAG }}

      - name: Build and push Docker image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GENERATE_SOURCEMAP=${{ env.GENERATE_SOURCEMAP }}
            VITE_APPLICATION_ID=${{ env.VITE_APPLICATION_ID }}
            VITE_BASE_URL=${{ env.VITE_BASE_URL }}
            VITE_VALIDATE_URL=${{ env.VITE_VALIDATE_URL }}

      - name: Deploy to AWS - EC2
        id: deploy
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PROD_PRIVATE_KEY }}
          HOSTNAME: ${{ vars.SSH_PROD_HOST }}
          USER_NAME: ${{ vars.USER_NAME }}
        run: |
          echo "$PRIVATE_KEY" > private_key.pem && chmod 600 private_key.pem
          ssh -o "StrictHostKeyChecking no" -i private_key.pem ${USER_NAME}@${HOSTNAME} '
              # Now we have got the access of EC2 and will start the deployment.
              export LATEST=${{env.RELEASE-TAG}}
              echo "Latest version: $LATEST"
              docker-compose -f /app/gaming-app.yml up -d
              ' 
